title = "Kanban gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret (GOCSPX- prefix)"
regex = '''GOCSPX-[0-9a-zA-Z_-]{28}'''
keywords = ["GOCSPX"]

[[rules]]
id = "dotnet-user-secrets"
description = "Hardcoded ASP.NET credential string literal (ClientSecret/ClientId = \"value\")"
regex = '''(ClientSecret|ClientId)\s*[:=]\s*["'][A-Za-z0-9_\-\.]{10,}["']'''
keywords = ["ClientSecret", "ClientId"]
